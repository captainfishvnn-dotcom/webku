<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kuliner Nusantara & Western Menu</title>
    <link rel="stylesheet" href="style.css">
    <!-- Font Awesome untuk Icon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <!-- Header & Navigasi -->
    <header class="navbar">
        <div class="logo">
            <i class="fa-solid fa-utensils"></i>
            <span>KulinerKu</span>
        </div>
        <nav>
            <ul>
                <li><a href="#home">Beranda</a></li>
                <li><a href="#menu">Daftar Menu</a></li>
                <li><a href="#about">Tentang Kami</a></li>
            </ul>
        </nav>
        <div class="cart-icon" onclick="toggleCart()">
            <i class="fa-solid fa-cart-shopping"></i>
            <span id="cart-count">0</span>
        </div>
    </header>

    <!-- Hero Section -->
    <section id="home" class="hero">
        <div class="hero-content">
            <h1>Selamat Datang di Web Kuliner</h1>
            <p>Nikmati hidangan lezat berkualitas pilihan terbaik untuk Anda.</p>
            <a href="#menu" class="btn-primary">Lihat Menu</a>
        </div>
    </section>

    <!-- Menu Section -->
    <section id="menu" class="menu-container">
        <h2 class="section-title">Menu Favorit Kami</h2>
        
        <!-- Filter Category -->
        <div class="filter-buttons">
            <button class="filter-btn active" onclick="filterMenu('all')">Semua</button>
            <button class="filter-btn" onclick="filterMenu('makanan')">Makanan</button>
            <button class="filter-btn" onclick="filterMenu('minuman')">Minuman</button>
        </div>

        <div class="menu-grid" id="menu-grid">
            <!-- Item menu akan di-render oleh JavaScript -->
        </div>
    </section>

    <!-- Modal Keranjang Belanja -->
    <div id="cart-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3><i class="fa-solid fa-basket-shopping"></i> Keranjang Belanja</h3>
                <span class="close-btn" onclick="toggleCart()">&times;</span>
            </div>
            <div class="modal-body" id="cart-items">
                <p class="empty-cart-msg">Keranjang Anda masih kosong.</p>
            </div>
            <div class="modal-footer">
                <div class="total-price">
                    <span>Total:</span>
                    <strong id="cart-total">Rp 0</strong>
                </div>
                <button class="btn-checkout" onclick="checkout()">Checkout Sekarang</button>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer>
        <p>&copy; 2026 Kuliner Nusantara. All Rights Reserved.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
